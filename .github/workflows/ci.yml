name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# RUNNER_LABEL (variável do repositório) escolhe onde os jobs rodam. Sem ela, usa o runner do GitHub.
# Com RUNNER_LABEL=zela-local, usa o runner próprio registrado no repositório.
env:
  # Nomes públicos dos recursos (sem segredo). Os identificadores de login ficam em GitHub Secrets.
  ACR_NAME: zelaacruylmp
  RESOURCE_GROUP: rg-zela-uylmp
  CONTAINER_APP: ca-zela-uylmp

jobs:
  testes:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest api/tests -q --ignore=api/tests/test_vision.py

  gitleaks:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    container: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/dockerfile --error api infra

  terraform:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate

  imagem:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [testes]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t zela-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zela-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    # Só a main publica, e só depois de testes, segredos, SAST, Terraform e Trivy passarem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [testes, gitleaks, semgrep, terraform, imagem]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write # login OIDC no Azure, sem senha guardada
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build e push da imagem
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/zela-api:${GITHUB_SHA::12}"
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Atualiza o Container App
        run: az containerapp update -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --image "$IMAGE"
      - name: Teste de fumaça
        run: |
          URL="https://$(az containerapp show -n "$CONTAINER_APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/health" | grep -q '"ok"'; then echo "no ar: $URL"; exit 0; fi
            sleep 10
          done
          echo "a API não respondeu depois do deploy" >&2
          exit 1
