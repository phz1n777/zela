name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest api/tests -q --ignore=api/tests/test_vision.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.97.0
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/dockerfile --error api infra

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform validate

  imagem:
    runs-on: ubuntu-latest
    needs: [testes]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f api/Dockerfile -t zela-api:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: zela-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
