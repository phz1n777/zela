# Prometheus local lendo o MVP publicado no Azure.
global:
  scrape_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: zela-api-azure
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["ca-zela-uylmp.jollyglacier-50c67627.spaincentral.azurecontainerapps.io"]
